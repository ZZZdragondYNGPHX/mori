[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mori-companion"
version = "0.4.0"
description = "Mori Companion: a lightweight, provider-neutral AI desktop companion"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
assets = ["Pillow>=10"]
desktop-input = ["PyGObject>=3.48; sys_platform == 'linux'"]

[project.scripts]
mori-companion = "companion.runtime:main"
companionctl = "companion.cli:main"
mori-codex = "companion.adapters.codex_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["companionctl", "mori_codex"]
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
character = ["prompts/*.md", "prompts/upstream/*.md", "prompts/upstream/*.txt"]
asset_library = ["move/*.json", "move/*/*.png", "move/*/*/*.png", "move/*/*.gif", "move/*/*/*.gif", "talk/*.txt", "interaction/*.png", "interaction/*.json", "motion/*.png", "motion/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
