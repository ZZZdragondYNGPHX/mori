<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mori Companion · 四向步态与触摸反应</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:#e8eff9;background:#101721;--muted:#aab9ca;--line:#334254;--cyan:#8edce6}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,select{color:inherit;border:1px solid var(--line);background:#1b2939;border-radius:9px;padding:9px 14px;cursor:pointer}button:hover{background:#293b50}button:active{transform:translateY(1px)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}button[aria-pressed=true]{background:#a2e0e7;color:#102530;border-color:#a2e0e7}a{color:var(--cyan)}
header,main,footer{max-width:1120px;margin:auto;padding:0 28px}header{padding-top:44px}.brand{font-size:12px;letter-spacing:.14em;color:var(--cyan);font-weight:650}.intro{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:16px 0 24px}h1{font-size:clamp(25px,4vw,38px);letter-spacing:-.04em;font-weight:650;margin:0 0 12px}p{color:var(--muted);line-height:1.8;margin:0}.batch{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:7px 12px;font-size:12px;color:var(--muted)}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 0 24px;border-top:1px solid var(--line)}.toolbar label{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.hint{margin-left:auto;font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#182331}.card-head{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:17px;margin:0;font-weight:600}.view{font-size:11px;color:var(--muted);letter-spacing:.04em}.stage{height:250px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at 60% 45%,#263e59 0%,#182331 68%)}.stage.checker{background:repeating-conic-gradient(#233145 0% 25%,#1c283a 0% 50%) 50%/20px 20px}.ground{position:absolute;left:20px;right:20px;bottom:18px;height:1px;background:#3c536b}canvas{width:280px;height:230px;position:relative;max-width:100%;object-fit:contain}.details{padding:0 20px 20px;min-height:111px}.description{font-size:12px;line-height:1.7;min-height:42px}.pose{display:block;font-variant-numeric:tabular-nums;color:#89a0b9;font-size:11px;margin:8px 0 0}.reaction-controls{display:flex;align-items:center;gap:8px;margin:10px 0}.reaction-controls button{font-size:12px;padding:8px 10px;min-height:36px}.reaction-controls select{font-size:12px;padding:8px}.reaction-state{font-size:12px;color:#f3bec8;min-height:20px}.reduced{padding:8px 0;font-size:12px;color:var(--muted)}footer{padding-top:26px;padding-bottom:36px;font-size:12px;color:var(--muted);line-height:1.9}footer p{margin-bottom:8px}
@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{width:100%;margin:0}}@media(max-width:560px){header,main,footer{padding-left:18px;padding-right:18px}header{padding-top:28px}main{grid-template-columns:1fr}.intro{display:block}.batch{display:inline-block;margin-top:16px}.toolbar button,.toolbar select{min-height:44px}.stage{height:255px}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<header>
<div class="brand">MORI COMPANION / 茉伴</div>
<div class="intro"><div><h1>四向步态与触摸反应</h1><p>小碎步、轻轻摸头，还有一条怕痒的大尾巴。<br>慢放或逐帧查看，观察迈步、表情和尾巴的变化。</p></div><span class="batch">第一批 · 24 张关键姿势</span></div>
<div class="toolbar" aria-label="预览播放控制">
<button id="play" aria-pressed="true">暂停</button><button id="step">下一帧</button>
<label>速度<select id="speed"><option value=".5">0.5× 慢放</option><option value="1" selected>1× 正常</option><option value="1.5">1.5×</option></select></label>
<button id="background" aria-pressed="false">透明网格</button>
<span class="hint">走路循环播放 · 触摸反应点击触发，结束后停留</span>
</div>
<p id="status" class="reduced" aria-live="polite"></p>
</header>
<main id="cards"></main>
<footer>
<p>每个方向各有 4 张独立关键姿势；摸头与尾巴各有 3 个递进层级、每层 2 种节奏变化。连续互动逐渐害羞，安静 12 秒后恢复轻度反应。</p>
<p>本页直接播放透明 PNG，和桌宠使用同一份动作清单。GIF 导出用于分享。<a href="../output/motion-study-v1/prompts.json">生图提示词</a> · <a href="../src/asset_library/motion/clips.json">动作清单</a> · <a href="gif-preview.html">原有工作动作</a></p>
</footer>
<script src="motion-preview-data.js"></script>
<script>
"use strict";
const manifest=window.MORI_MOTION;
const specs=[
 {id:"walk-left",title:"向左走",view:"左侧视角",description:"朝左迈步，尾巴留在身后；观察手臂与前后脚的交替。"},
 {id:"walk-right",title:"向右走",view:"右侧视角",description:"朝右迈步，独立绘制的右向姿势；尾巴与头发轻轻跟随。"},
 {id:"walk-up",title:"伪上 · 朝远处走",view:"后侧视角",description:"后脑与背部更明显，后脚抬起时露出鞋底。"},
 {id:"walk-down",title:"伪下 · 朝你走来",view:"正面视角",description:"保留正脸与围裙，左右脚轮流向前，带动重心变化。"},
 {id:"head",title:"轻轻摸头",view:"亲近 → 害羞",description:"缩脖子、闭眼享受、歪头轻蹭，再害羞地捂住脸颊。",reaction:true},
 {id:"tail",title:"碰一下尾巴",view:"敏感但亲近",description:"惊一下、缩尾回头，再护住怕痒的尾巴，偷偷看你。",reaction:true}
];
const images=new Map();const cards=[];let playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,speed=1,last=0,visible=true;
const play=document.querySelector("#play"),status=document.querySelector("#status");
function syncPlay(){play.textContent=playing?"暂停":"播放";play.setAttribute("aria-pressed",String(playing));}
syncPlay();if(!playing)status.textContent="已按系统减少动态效果设置暂停，可手动播放或逐帧查看。";
async function loadImage(file){if(images.has(file))return images.get(file);const img=new Image();img.src="../src/asset_library/motion/"+file;await img.decode();images.set(file,img);return img;}
function currentIndex(card){let ms=card.elapsed;const durations=card.clip.durations,total=durations.reduce((a,b)=>a+b,0);ms=card.clip.loop?ms%total:Math.min(ms,total-1);for(let i=0;i<durations.length;i++){if(ms<durations[i])return i;ms-=durations[i];}return durations.length-1;}
function draw(card){const index=currentIndex(card),image=images.get(card.clip.frames[index]);if(!image)return;const ctx=card.context;ctx.clearRect(0,0,280,230);ctx.save();if(card.clip.loop){const total=card.clip.durations.reduce((a,b)=>a+b,0),x=card.spec.id==="walk-left"?95:185;ctx.translate(x,manifest.baseline);ctx.rotate(Math.sin(card.elapsed/total*Math.PI*2)*manifest.walk_sway_degrees*Math.PI/180);ctx.translate(-x,-manifest.baseline);}ctx.drawImage(image,0,0);ctx.restore();card.pose.textContent=`关键姿势 ${card.clip.frames[index].match(/-(\d+)\.png$/)[1]*1+1} / 4`;}
function setClip(card,name){card.clip=manifest.clips[name];card.elapsed=0;draw(card);}
function react(card,forced){const now=performance.now();card.level=forced||((now-card.lastTouch<12000)?Math.min(3,card.level+1):1);card.lastTouch=now;card.variant=1-card.variant;setClip(card,`${card.spec.id}-${card.level}-${card.variant}`);card.state.textContent=["轻轻回应","更亲近一点","害羞地回应"][card.level-1]+` · 变化 ${card.variant+1}`;}
for(const spec of specs){
 const element=document.createElement("section");element.className="card";
 element.innerHTML=`<div class="card-head"><h2>${spec.title}</h2><span class="view">${spec.view}</span></div><div class="stage"><div class="ground"></div><canvas width="280" height="230" role="img" aria-label="${spec.title}动画"></canvas></div><div class="details"><p class="description">${spec.description}</p><span class="pose"></span>${spec.reaction?`<div class="reaction-controls"><button>连续${spec.id==="head"?"摸头":"碰尾巴"}</button><select aria-label="${spec.title}反应层级"><option value="1">轻度</option><option value="2">亲近</option><option value="3">害羞</option></select><button class="replay">重播所选</button></div><div class="reaction-state" aria-live="polite">等待你的互动</div>`:""}</div>`;
 document.querySelector("#cards").append(element);
 const card={spec,element,context:element.querySelector("canvas").getContext("2d"),pose:element.querySelector(".pose"),elapsed:0,clip:manifest.clips[spec.reaction?`${spec.id}-1-0`:spec.id],level:0,lastTouch:-Infinity,variant:1,state:element.querySelector(".reaction-state")};
 if(spec.reaction){card.elapsed=card.clip.durations.reduce((a,b)=>a+b,0);element.querySelector("button").onclick=()=>{react(card);if(!playing)status.textContent="反应已就绪，可按播放或下一帧查看。";};element.querySelector(".replay").onclick=()=>react(card,Number(element.querySelector("select").value));}
 cards.push(card);
}
play.onclick=()=>{playing=!playing;syncPlay();status.textContent="";};
document.querySelector("#speed").onchange=e=>{speed=Number(e.target.value);};
document.querySelector("#step").onclick=()=>{playing=false;syncPlay();for(const card of cards){const index=currentIndex(card),durations=card.clip.durations;let next=durations.slice(0,index+1).reduce((a,b)=>a+b,0);const total=durations.reduce((a,b)=>a+b,0);if(next>=total)next=card.clip.loop?0:total-1;card.elapsed=next;draw(card);}};
document.querySelector("#background").onclick=e=>{const enabled=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",String(enabled));for(const card of cards)card.element.querySelector(".stage").classList.toggle("checker",enabled);};
document.addEventListener("visibilitychange",()=>{visible=!document.hidden;last=0;});
function tick(now){const delta=last?Math.min(100,now-last):0;last=now;if(playing&&visible){for(const card of cards){card.elapsed+=delta*speed;draw(card);}}requestAnimationFrame(tick);}
Promise.all([...new Set(Object.values(manifest.clips).flatMap(c=>c.frames))].map(loadImage)).then(()=>{cards.forEach(draw);requestAnimationFrame(tick);}).catch(error=>{status.textContent="素材读取失败，请从项目目录打开此预览。";console.error(error);});
</script>
</body>
</html>
